name: 'CI checks'
description: 'Checks if the code builds and typechecks'

runs:
  using: 'composite'
  steps:
    - name: Build
      run: pnpm build
      shell: bash
    - name: Typecheck
      run: pnpm typecheck
      shell: bash
    - name: System regression tests
      run: pnpm test:system
      shell: bash
